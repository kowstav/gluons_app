[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gluons"
version = "0.1.0"
description = "Gluons control plane: identity, policy, durable automation runtime, connectors and MCP."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy>=2.0.35,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "jsonschema>=4.23,<5",
  "python-multipart>=0.0.12",
  "pyotp>=2.9,<3",
]

[project.optional-dependencies]
# Each optional extra wraps an upstream behind a Gluons-owned interface and is
# imported lazily, so the control plane runs without it.
mcp = ["mcp>=1.20"]
optimization = ["ortools>=9.11"]
documents = ["markitdown[pdf]>=0.1.2", "pypdf>=5"]
docling = ["docling>=2.15"]
llm = ["anthropic>=0.40", "openai>=1.60", "google-genai>=1.0"]
gcp = ["google-cloud-kms>=3", "google-cloud-tasks>=2.17", "google-cloud-pubsub>=2.25", "google-cloud-storage>=2.18", "google-auth>=2.35"]
dev-postgres = ["pixeltable-pgserver>=0.7"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5",
  "ruff>=0.7",
  "respx>=0.21",
]

[project.scripts]
gluons = "gluons.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gluons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "provider_sandbox: talks to a real provider sandbox; requires credentials",
  "slow: long running",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"src/gluons/cli.py" = ["T20"]
