id: gluons.paid_ad_campaign_operations
slug: paid_ad_campaign_operations
version: 1.0.0
title: Paid Ad Campaign Operations
domain: marketing
risk_tier: R3
regulated: false
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        ad_accounts:
          description: ad accounts; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        brand_policy:
          description: brand policy; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        pixel_events:
          description: pixel/events; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        authorized_budget:
          description: authorized budget; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        catalog:
          description: catalog; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        landing_pages:
          description: landing pages; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: advertising
  providers:
  - customer_ad_account
  purpose: Owned ad accounts and enforced spend caps.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Paid Ad Campaign Operations draft requires domain review
        subject: draft
        risk_tier: R2
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Policy suspension: review
  inaccurate attribution: review
  brand safety: review
  runaway spend: review
  campaign rejection: review
metrics:
- CAC
- ROAS
- creative_rejection_rate
- budget_overruns
declared_status: blocked_by_external_dependency
blockers:
- dependency: customer_ad_account
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
