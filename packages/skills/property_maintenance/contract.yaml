id: gluons.property_maintenance
slug: property_maintenance
version: 1.0.0
title: Property Maintenance
domain: maintenance
risk_tier: R3
regulated: false
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        tenant_and_property_directory:
          description: tenant and property directory; owner-supplied data remains
            unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        emergency_contacts:
          description: emergency contacts; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        maintenance_policies:
          description: maintenance policies; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        vendor_list:
          description: vendor list; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        spending_thresholds:
          description: spending thresholds; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        accounting:
          description: accounting; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: property
  providers:
  - customer_property_system
  purpose: Verify properties, tenants and work orders.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Property Maintenance draft requires domain review
        subject: draft
        risk_tier: R2
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Gas leak: review
  flooding: review
  tenant identity uncertainty: review
  no contractor: review
  quote over limit: review
  incomplete repair: review
  invoice mismatch: review
metrics:
- time_to_acknowledge
- repair_cycle_days
- landlord_touchpoints
- reopen_rate
- invoice_accuracy
declared_status: blocked_by_external_dependency
blockers:
- dependency: customer_property_system
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
