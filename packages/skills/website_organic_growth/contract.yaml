id: gluons.website_organic_growth
slug: website_organic_growth
version: 1.0.0
title: Website Organic Growth
domain: marketing
risk_tier: R2
regulated: false
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        business_site:
          description: business site; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        cms:
          description: CMS; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        google_search_console:
          description: Google Search Console; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        analytics:
          description: analytics; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        business_facts:
          description: business facts; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        seo_policy:
          description: SEO policy; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: cms
  providers:
  - customer_cms
  purpose: Owned site, versioned publishing and Search Console data.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Website Organic Growth draft requires domain review
        subject: draft
        risk_tier: R2
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Unverified claims: review
  generated spam: review
  CMS publishing error: review
  indexing delay: review
  keyword cannibalization: review
metrics:
- organic_leads
- indexed_pages
- crawl_issues
- content_correction_rate
declared_status: blocked_by_external_dependency
blockers:
- dependency: customer_cms
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
