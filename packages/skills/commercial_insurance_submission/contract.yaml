id: gluons.commercial_insurance_submission
slug: commercial_insurance_submission
version: 1.0.0
title: Commercial Insurance Submission
domain: insurance
risk_tier: R4
regulated: true
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        risk_application:
          description: risk application; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        prior_policy:
          description: prior policy; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        claims_history:
          description: claims history; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        carrier_forms:
          description: carrier forms; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        licensed_broker_rules:
          description: licensed broker rules; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: insurance
  providers:
  - customer_broker_system
  purpose: Broker-authorized carriers and submission interface.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Commercial Insurance Submission draft requires domain review
        subject: draft
        risk_tier: R4
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Conflicting loss data: review
  excluded business class: review
  missing signed representations: review
  coverage ambiguity: review
metrics:
- submission_prep_time
- missing_field_rate
- carrier_rework
- audit_findings
declared_status: blocked_by_external_dependency
blockers:
- dependency: customer_broker_system
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
