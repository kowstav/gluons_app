id: gluons.legal_matter_intake
slug: legal_matter_intake
version: 1.0.0
title: Legal Matter Intake
domain: legal
risk_tier: R4
regulated: true
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        approved_matter_types:
          description: approved matter types; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        attorney_directory:
          description: attorney directory; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        conflicts_database:
          description: conflicts database; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        intake_forms:
          description: intake forms; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        document_policy:
          description: document policy; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: legal
  providers:
  - customer_case_management
  purpose: Restricted conflicts records and attorney review.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Legal Matter Intake draft requires domain review
        subject: draft
        risk_tier: R4
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Imminent deadline: review
  conflict flag: review
  vulnerable client: review
  privileged material: review
  out-of-jurisdiction: review
metrics:
- intake_completion
- response_time
- missed_conflict_rate
- abandonment
declared_status: blocked_by_external_dependency
blockers:
- dependency: customer_case_management
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
