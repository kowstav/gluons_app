id: gluons.shopping_guidance
slug: shopping_guidance
version: 1.0.0
title: Shopping Guidance
domain: sales
risk_tier: R2
regulated: false
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        product_catalog:
          description: product catalog; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        prices:
          description: prices; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        inventory:
          description: inventory; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        fit_guides:
          description: fit guides; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        return_policies:
          description: return policies; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        customer_consent:
          description: customer consent; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        review_corpus:
          description: review corpus; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: storefront
  providers:
  - shopify
  purpose: Retrieve actual catalog, stock and storefront links.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Shopping Guidance draft requires domain review
        subject: draft
        risk_tier: R2
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Out-of-stock: review
  conflicting sizing: review
  unsafe product claim: review
  ambiguous preferences: review
  inaccessible catalog: review
metrics:
- recommendation_accuracy
- assisted_conversion
- hallucination_rate
- support_deflection
declared_status: blocked_by_external_dependency
blockers:
- dependency: shopify
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
