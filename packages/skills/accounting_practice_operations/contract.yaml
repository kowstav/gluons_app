id: gluons.accounting_practice_operations
slug: accounting_practice_operations
version: 1.0.0
title: Accounting Practice Operations
domain: finance
risk_tier: R4
regulated: true
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        client_accounting_system:
          description: client accounting system; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        payroll:
          description: payroll; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        receipts:
          description: receipts; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        tax_authority_rules:
          description: tax authority rules; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        approval_schedule:
          description: approval schedule; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: accounting
  providers:
  - customer_accounting_system
  purpose: Client-specific ledger and licensed review.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Accounting Practice Operations draft requires domain review
        subject: draft
        risk_tier: R4
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Mixed client records: review
  VAT regime mismatch: review
  payroll confidentiality: review
  outdated authority guidance: review
metrics:
- hours_saved
- process_accuracy
- cross_client_leaks
- client_close_timeliness
declared_status: blocked_by_external_dependency
blockers:
- dependency: customer_accounting_system
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
