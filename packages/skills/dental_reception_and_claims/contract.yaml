id: gluons.dental_reception_and_claims
slug: dental_reception_and_claims
version: 1.0.0
title: Dental Reception And Claims
domain: health
risk_tier: R4
regulated: true
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        patient_identity:
          description: patient identity; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        consent:
          description: consent; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        practice_calendar:
          description: practice calendar; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        coverage_eligibility:
          description: coverage eligibility; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        pms:
          description: PMS; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        claims_status:
          description: claims status; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        hipaa_health_rules:
          description: HIPAA/health rules; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: health
  providers:
  - customer_practice_system
  purpose: Approved patient records, scheduling and claims.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Dental Reception And Claims draft requires domain review
        subject: draft
        risk_tier: R4
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Medical emergency: review
  patient identity mismatch: review
  claim denial dispute: review
  protected health data: review
  uncovered services: review
metrics:
- call_resolution
- appointment_accuracy
- no_show_rate
- claims_followup_days
declared_status: blocked_by_external_dependency
blockers:
- dependency: customer_practice_system
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
