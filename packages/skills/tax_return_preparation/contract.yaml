id: gluons.tax_return_preparation
slug: tax_return_preparation
version: 1.0.0
title: Tax Return Preparation
domain: finance
risk_tier: R4
regulated: true
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        tax_year_forms:
          description: tax-year forms; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        client_identity:
          description: client identity; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        source_documents:
          description: source documents; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        licensed_tax_software:
          description: licensed tax software; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        jurisdiction_rules:
          description: jurisdiction rules; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: tax
  providers:
  - licensed_tax_software
  purpose: Licensed preparer, current rules and tax software.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Tax Return Preparation draft requires domain review
        subject: draft
        risk_tier: R4
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Missing tax forms: review
  inconsistent amounts: review
  jurisdiction differences: review
  suspicious deductions: review
  stale tax guidance: review
metrics:
- prep_hours
- missing_form_rate
- reviewer_corrections
- submission_errors
declared_status: blocked_by_external_dependency
blockers:
- dependency: licensed_tax_software
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
