id: gluons.workflow_discovery
slug: workflow_discovery
version: 1.0.0
title: Workflow Discovery
domain: discovery
risk_tier: R3
regulated: false
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        explicit_observation_consent:
          description: explicit observation consent; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        permitted_event_fields:
          description: permitted event fields; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        permitted_apps:
          description: permitted apps; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        retention_limits:
          description: retention limits; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        baseline_task_timings:
          description: baseline task timings; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: telemetry
  providers:
  - consented_process_log
  purpose: Only consented permitted metadata, never covert collection.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Workflow Discovery draft requires domain review
        subject: draft
        risk_tier: R2
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Accidental credentials capture: review
  personal browsing: review
  ambiguous work pattern: review
  insufficient samples: review
  protected employee data: review
metrics:
- opportunities_discovered
- precision_of_proposals
- hours_recovered
- false_positive_rate
declared_status: blocked_by_external_dependency
blockers:
- dependency: consented_process_log
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
