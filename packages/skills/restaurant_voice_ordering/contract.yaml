id: gluons.restaurant_voice_ordering
slug: restaurant_voice_ordering
version: 1.0.0
title: Restaurant Voice Ordering
domain: voice
risk_tier: R3
regulated: false
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        menus:
          description: menus; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        availability:
          description: availability; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        allergen_policy:
          description: allergen policy; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        delivery_radius:
          description: delivery radius; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        pos:
          description: POS; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        hours:
          description: hours; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        booking_calendar:
          description: booking calendar; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        transfer_contact:
          description: transfer contact; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: voice
  providers:
  - elevenlabs
  purpose: Receive a verified routed call.
- capability: pos
  providers:
  - customer_pos
  purpose: Verify menu and accepted order.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Restaurant Voice Ordering draft requires domain review
        subject: draft
        risk_tier: R2
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Noisy line: review
  incorrect STT: review
  allergy: review
  payment issue: review
  closure: review
  duplicate transfer: review
  caller changes order: review
metrics:
- orders_captured
- WER
- order_correction_rate
- transfers
- missed_calls
- average_cost_per_order
declared_status: blocked_by_external_dependency
blockers:
- dependency: elevenlabs, customer_pos
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
