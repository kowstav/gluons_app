id: gluons.crm_reactivation_and_hygiene
slug: crm_reactivation_and_hygiene
version: 1.0.0
title: Crm Reactivation And Hygiene
domain: sales
risk_tier: R2
regulated: false
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        crm_schema:
          description: CRM schema; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        stale_lead_policy:
          description: stale-lead policy; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        contact_consent:
          description: contact consent; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        last_touch_history:
          description: last-touch history; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        dedup_keys:
          description: dedup keys; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: crm
  providers:
  - customer_crm
  purpose: Authorized contact records, merge policy and consent.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Crm Reactivation And Hygiene draft requires domain review
        subject: draft
        risk_tier: R2
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Wrong merge: review
  suppressed lead: review
  stale consent: review
  duplicate sequence: review
  attribution mismatch: review
metrics:
- dedupe_precision
- CRM_completeness
- reactivated_replies
- errors_per_1000_records
declared_status: blocked_by_external_dependency
blockers:
- dependency: customer_crm
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
