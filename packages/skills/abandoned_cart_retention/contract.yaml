id: gluons.abandoned_cart_retention
slug: abandoned_cart_retention
version: 1.0.0
title: Abandoned Cart Retention
domain: sales
risk_tier: R2
regulated: false
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        shopify_orders:
          description: Shopify orders; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        opt_in_status:
          description: opt-in status; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        customer_messages:
          description: customer messages; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        product_inventory:
          description: product inventory; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        promo_approval:
          description: promo approval; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: storefront
  providers:
  - shopify
  purpose: Actual cart, order, consent and suppression status.
- capability: email
  providers:
  - gmail
  purpose: Only lawful approved customer communication.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Abandoned Cart Retention draft requires domain review
        subject: draft
        risk_tier: R2
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  No consent: review
  unreachable customer: review
  cart already purchased: review
  coupon ineligible: review
  messaging cap: review
metrics:
- recoveries
- incremental_net_revenue
- complaint_rate
- cost_per_recovered_cart
declared_status: blocked_by_external_dependency
blockers:
- dependency: shopify, gmail
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
