id: gluons.outbound_shipping_management
slug: outbound_shipping_management
version: 1.0.0
title: Outbound Shipping Management
domain: fulfillment
risk_tier: R3
regulated: false
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        warehouse_stock:
          description: warehouse stock; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        carrier_rates:
          description: carrier rates; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        address_validation:
          description: address validation; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        merchant_service_promise:
          description: merchant service promise; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        customs_data:
          description: customs data; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: shipping
  providers:
  - customer_shipping_provider
  purpose: Carrier labels and actual tracking evidence.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Outbound Shipping Management draft requires domain review
        subject: draft
        risk_tier: R2
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Inventory shortfall: review
  invalid address: review
  customs missing: review
  carrier pickup failed: review
  lost parcel: review
metrics:
- on_time_delivery
- shipping_cost_per_order
- support_contacts
- exceptions
declared_status: blocked_by_external_dependency
blockers:
- dependency: customer_shipping_provider
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
