id: gluons.bookkeeping_reconciliation
slug: bookkeeping_reconciliation
version: 1.0.0
title: Bookkeeping Reconciliation
domain: finance
risk_tier: R4
regulated: true
activation_modes:
- historical_replay
- shadow
execution_scope: draft_only
inputs:
  type: object
  required:
  - facts
  - source_evidence
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 100000
    facts:
      type: object
      maxProperties: 100
      properties:
        bank_feed:
          description: bank feed; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        general_ledger:
          description: general ledger; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        vendor_invoices:
          description: vendor invoices; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        payroll:
          description: payroll; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        receipt_archive:
          description: receipt archive; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
        accounting_policy:
          description: accounting policy; owner-supplied data remains unverified.
          type:
          - string
          - number
          - boolean
          - array
          - object
      additionalProperties: true
    source_evidence:
      type: array
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 1000
outputs:
  type: object
  required:
  - draft_id
  - execution_scope
  - pending_workflow
  - external_actions_performed
  - verified_external_outcome
  properties:
    draft_id:
      type: string
    execution_scope:
      const: draft_only
    pending_workflow:
      type: array
    external_actions_performed:
      const: 0
    verified_external_outcome:
      const: false
    calculations:
      type: object
    review_reasons:
      type: array
      items:
        type: string
connectors:
- capability: accounting
  providers:
  - erpnext
  purpose: Read legal-entity ledger and reconcile approved entries.
actions: []
default_policy:
  mode: shadow
  allowed_actions: []
graph:
  entry: prepare
  nodes:
    prepare:
      primitive: domain
      params:
        fn: drafts.prepare
      blueprint_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      checkpoint: true
      next: review
    review:
      primitive: human_review
      params:
        title: Bookkeeping Reconciliation draft requires domain review
        subject: draft
        risk_tier: R4
      next: finish
      branches:
        shadow: finish
        approved: finish
        denied: finish
    finish:
      primitive: complete
      params:
        outcome: draft_prepared_only
        report:
        - draft
failure_handling:
  Unmatched transaction: review
  multi-entity transfer: review
  tax ambiguity: review
  bank mismatch: review
  duplicate feed: review
metrics:
- auto_match_rate
- unresolved_amount
- close_days
- correction_rate
declared_status: blocked_by_external_dependency
blockers:
- dependency: erpnext
  needed: Implement and verify the skill-specific authorized provider graph; this
    contract only prepares review packets.
  kind: customer_system
limitations:
- Only input/evidence validation and a pending-work checklist run locally. Mapped
  blueprint steps are recorded as not_executed, not certified as implemented.
- No provider API operations or external-success claims. No supervised/live activation.
- Domain specialist review and provider sandbox evidence remain required.
