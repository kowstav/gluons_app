name: Verify Gluons integration plan
on:
  push:
  pull_request:
jobs:
  plan-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest pyyaml fastapi httpx
      - run: python scripts/audit_repo_registry.py
      - run: python validate_pack.py
      - run: python -m pytest -q tests/test_repo_intake.py tests/test_reference_api.py tests/test_permission_blueprint.py
# Before a production repository, pin third-party GitHub Actions to reviewed commit SHAs.
# This workflow validates the local plan only; it does NOT audit upstream dependencies.
