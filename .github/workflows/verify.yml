name: Verify Gluons
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official tag
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -c requirements.lock -e 'apps/api[dev,dev-postgres,mcp,optimization,documents]'
      - run: python -m ruff check apps/api
      - run: python -m pytest apps/api/tests -q
        env:
          PYTHONUTF8: '1'
          GLUONS_TEST_CLUSTER: ci
      - run: python scripts/check_traceability.py
      - run: docker compose config --quiet
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -c requirements.lock -e 'apps/api[dev,dev-postgres,mcp,optimization,documents]'
      - run: npm ci --prefix apps/web
      - run: npm audit --prefix apps/web --audit-level=high
      - run: npm run build --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e --prefix apps/web
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -f apps/api/Dockerfile -t gluons-api:test .
      - run: docker build -f apps/web/Dockerfile -t gluons-web:test .
