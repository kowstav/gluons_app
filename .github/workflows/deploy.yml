# Manual only. No push, tag or schedule can deploy.
#
# Staging runs first. Production can only follow in the same run, for the same commit, after
# staging passed, the operator typed the confirmation, and a reviewer approved the protected
# `production` GitHub environment. See docs/runbooks/deployment.md for setup and verification.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      staging_images_only:
        description: Build, scan, and publish staging images for the first Terraform deployment
        type: boolean
        default: false
      promote_to_production:
        description: After staging passes, request approval for a 10% production canary
        type: boolean
        default: false
      confirm_production:
        description: Type DEPLOY PRODUCTION to allow the canary
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify CI for the exact release commit
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the latest push CI run on main to have passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Dispatch releases from main."
            exit 1
          fi
          result=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$GITHUB_SHA" -F per_page=1 \
            --jq '.workflow_runs[0] | [.head_sha, .status, .conclusion] | join(" ")')
          if [[ "$result" != "$GITHUB_SHA completed success" ]]; then
            echo "This commit needs a successful push CI run before deployment."
            exit 1
          fi
      - name: Require a configured production reviewer before starting a promotion
        if: ${{ !inputs.staging_images_only && inputs.promote_to_production && inputs.confirm_production == 'DEPLOY PRODUCTION' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! reviewed=$(gh api "repos/$GITHUB_REPOSITORY/environments/production" \
            --jq 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0)') ||
            [[ "$reviewed" != true ]]; then
            echo "Configure at least one required reviewer in the GitHub production environment before promotion."
            exit 1
          fi

  staging:
    needs: verify
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: staging
      canary_percent: 100
      images_only: ${{ inputs.staging_images_only }}

  production:
    needs: staging
    if: ${{ !inputs.staging_images_only && inputs.promote_to_production && inputs.confirm_production == 'DEPLOY PRODUCTION' }}
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: production
      canary_percent: 10
