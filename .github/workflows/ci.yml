# Checks only. Nothing here touches a cloud account, and no job holds a cloud credential.
# Third-party actions are pinned to full commit SHAs, with the tag in a trailing comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13.3'
  NODE_VERSION: '24.11.1'
  TERRAFORM_VERSION: '1.17.1'
  PIP_AUDIT_VERSION: '2.10.1'

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            apps/api/pyproject.toml
      - name: Install
        run: python -m pip install -c requirements.lock -e "apps/api[dev,dev-postgres,mcp,optimization,documents]"
      - name: Ruff
        run: python -m ruff check apps/api
      - name: Traceability matrix is valid and current
        run: |
          python scripts/check_traceability.py
          git diff --exit-code -- docs/BLUEPRINT_TRACEABILITY.md
      - name: Pytest against real PostgreSQL as the restricted role
        working-directory: apps/api
        env:
          PYTHONPATH: tests
        run: python -m pytest

  migrations:
    name: Migration check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            apps/api/pyproject.toml
      - name: Install
        run: python -m pip install -c requirements.lock -e "apps/api[dev-postgres]"
      - name: Apply to an empty database
        run: python -m gluons.devdb | grep '^GLUONS_' >> "$GITHUB_ENV"
      - name: One head, no model drift, reversible
        working-directory: apps/api
        env:
          GLUONS_DEV_ROLE_PASSWORDS: '1'
        run: |
          test "$(python -m alembic heads | wc -l)" -eq 1
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head

  web:
    name: Web typecheck, build and Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            apps/api/pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install the API that Playwright runs against
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -c requirements.lock -e "apps/api[dev-postgres,mcp,optimization,documents]"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: apps/web
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed only when the repository belongs to a GitHub organisation.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pip-audit
        run: |
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
          pip-audit --no-deps --disable-pip -r requirements.lock -r infra/docker/requirements-gcp.lock
      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high

  images:
    name: Image scan and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - {name: api, dockerfile: apps/api/Dockerfile}
          - {name: web, dockerfile: apps/web/Dockerfile}
          - {name: sandbox-erp, dockerfile: apps/sandbox_erp/Dockerfile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          tags: gluons-${{ matrix.image.name }}:ci
          load: true
          push: false
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gluons-${{ matrix.image.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: gluons-${{ matrix.image.name }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.image.name }}.spdx.json

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate without a backend or credentials
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
